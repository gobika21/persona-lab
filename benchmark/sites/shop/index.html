<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Kiln &amp; Co. – Mugs</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; color: #1d1d1f; background: #fff; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 16px 32px; border-bottom: 1px solid #ddd; }
  header .logo { font-weight: 800; font-size: 20px; color: #1d1d1f; text-decoration: none; }
  .cart { display: inline-flex; padding: 8px; border-radius: 8px; }
  .cart:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid #1a5fd0; outline-offset: 2px; }
  main { padding: 32px; }
  h1 { margin: 0 0 6px; }
  .grid { display: flex; gap: 24px; margin-top: 24px; }
  .card { border: 1px solid #ddd; border-radius: 14px; padding: 18px; width: 180px; text-align: center; }
  .mug { width: 90px; height: 90px; border-radius: 12px 12px 30px 30px; margin: 0 auto 12px; }
  .card button { margin-top: 10px; padding: 8px 14px; border-radius: 8px; border: 1px solid #1d1d1f; background: #fff; font: inherit; cursor: pointer; }
  .small { font-size: 11px; color: #a3a3a3; margin-top: 28px; }          /* PLANTED: shop-tiny-text */
</style></head>
<body>
  <header>
    <a class="logo" href="index.html">Kiln &amp; Co.</a>
    <!-- PLANTED: shop-cart-unnamed (icon-only link) -->
    <a class="cart" href="cart.html"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.4 10.5h10.8L21 7H6.2" fill="none" stroke="#1d1d1f" stroke-width="2"/><circle cx="9" cy="19" r="1.6"/><circle cx="17" cy="19" r="1.6"/></svg></a>
  </header>
  <main>
    <h1>Classic mug</h1>
    <p>Hand-thrown stoneware, 350 ml. AED 45.</p>
    <!-- PLANTED: shop-color-only-variants (variants are identified only by their color) -->
    <div class="grid">
      <div class="card"><div class="mug" style="background:#c0392b"></div><div>Classic mug</div><button type="button" onclick="location.href='cart.html?item=red'">Add to cart</button></div>
      <div class="card"><div class="mug" style="background:#2e8b3d"></div><div>Classic mug</div><button type="button" onclick="location.href='cart.html?item=green'">Add to cart</button></div>
      <div class="card"><div class="mug" style="background:#8a6d3b"></div><div>Classic mug</div><button type="button" onclick="location.href='cart.html?item=brown'">Add to cart</button></div>
    </div>
    <p class="small">Free returns within 30 days. Ships from Dubai in 2 working days.</p>
  </main>
</body>
</html>
