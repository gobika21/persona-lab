<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Contact – Sunset Hotel</title>
<style>
  body { font-family: Georgia, serif; margin: 0; color: #222; background: #fffaf3; }
  header { background: #b3261e; color: #fff; padding: 16px 32px; }
  header a { color: #fff; }
  main { padding: 32px; }
  .dot-ok { color: #2e7d32; } .dot-full { color: #c62828; }
  input { padding: 8px; font-size: 15px; }
  button { padding: 8px 12px; }
</style></head>
<body>
  <header><a href="index.html">Sunset Hotel</a></header>
  <main>
    <h1>Contact us</h1>
    <p>Call us on <strong>+971 4 555 0123</strong>, 8am–10pm.</p>
    <h2>Today</h2>
    <!-- PLANTED: hotel-status-color (meaning only by dot color) -->
    <p><span class="dot-ok">●</span> Rooms &nbsp; <span class="dot-full">●</span> Restaurant</p>
    <h2>Newsletter</h2>
    <form>
      <input type="email" placeholder="Your email">            <!-- PLANTED: hotel-email-unlabeled -->
      <button type="button"><svg width="16" height="16" aria-hidden="true"><path d="M2 8h12M9 3l5 5-5 5" stroke="#222" stroke-width="2" fill="none"/></svg></button> <!-- PLANTED: hotel-send-unnamed -->
    </form>
  </main>
</body>
</html>
